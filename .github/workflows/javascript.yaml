# github/workflows/drupal-module/javascript.yaml in
# https://github.com/itk-dev/devops_itkdev-docker if need be.

### ### Drupal module JavaScript (and TypeScript)
###
### Validates JavaScript files.
###
### #### Assumptions
###
### 1. A docker compose service named `prettier` for running
###    [Prettier](https://prettier.io/) exists.

name: JavaScript

on:
  pull_request:
    paths: &paths # - "js/**/*.js"
      - "tests/**/*.ts"
      - "docker-compose.yml"
  push:
    branches:
      - main
      - develop
    paths: *paths

jobs:
  javascript-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          docker compose run --rm prettier --no-editorconfig 'tests/**/*.ts' --check
